name: CI — Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            agent/go.sum
            controller/go.sum

      - name: Vet agent
        working-directory: ./agent
        run: go vet ./internal/state/... ./internal/metrics/... ./internal/version/... ./pkg/logging/...

      - name: Vet controller
        working-directory: ./controller
        run: go vet ./internal/updater/... ./internal/sshconfig/... ./internal/supabase/... ./internal/webrtc/...

      - name: Test agent
        working-directory: ./agent
        run: go test -short ./internal/state/... ./internal/metrics/... ./internal/version/... ./pkg/logging/...

      - name: Test controller
        working-directory: ./controller
        run: go test -short ./internal/updater/... ./internal/sshconfig/... ./internal/supabase/... ./internal/webrtc/...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck agent (advisory)
        working-directory: ./agent
        continue-on-error: true
        run: govulncheck ./...

      - name: govulncheck controller (advisory)
        working-directory: ./controller
        continue-on-error: true
        run: govulncheck ./...
